name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack SMS.zip if present
        run: |
          if [ -f SMS.zip ]; then rm -rf _src && mkdir _src && unzip -q SMS.zip -d _src; fi
          S=$(find . -name settings.gradle.kts | head -1)
          echo "DIR=$(dirname "$S")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        working-directory: ${{ env.DIR }}
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SMS-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/release/*.apk
